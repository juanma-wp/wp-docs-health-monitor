name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'out/**/results.json'
      - 'out/**/site.json'
      - 'config/*.json'
      - 'src/dashboard/**'
      - 'src/types/**'
      - 'scripts/rebuild.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Rebuild dashboard from committed results.json
        run: npm run rebuild

      - name: Add .nojekyll so Pages serves files starting with `_`
        run: touch out/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
