name: feedback-loop

# Closes the report-feedback loop automatically. When review verdicts land
# on main (feedback/<site>/<runId>.json — usually via a reviewed PR), this
# workflow re-runs `feedback apply`, which:
#
#   - recomputes feedback/<site>/metrics.json (precision trend per site)
#   - regenerates the auto-calibration block inside each site-extension
#     prompt (between the AUTO-CALIBRATION markers; hand-written rules are
#     untouched)
#
# and opens a PR with the result, so the NEXT validator run learns from the
# review. The PR goes through normal review — automation never writes the
# common system prompt, and direct pushes to main stay forbidden.
#
# metrics.json is excluded from the trigger paths so merging the PR this
# workflow opens does not re-trigger it (apply is idempotent anyway — a
# second run would find no diff and exit — but not triggering is cheaper).

on:
  push:
    branches: [main]
    paths:
      - 'feedback/**'
      - '!feedback/**/metrics.json'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Regenerate calibration blocks and metrics
        run: npx tsx scripts/feedback.ts apply | tee /tmp/feedback-apply.log

      - name: Open PR if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if git diff --quiet -- prompts feedback; then
            echo "Nothing changed — calibration already up to date."
            exit 0
          fi

          BRANCH="feedback-loop/${GITHUB_RUN_ID}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add prompts feedback
          git commit -m "feedback: regenerate calibration from review verdicts"
          git push -u origin "$BRANCH"

          {
            echo 'Auto-generated by the feedback-loop workflow from review verdicts pushed to `feedback/`.'
            echo
            echo 'Regenerates the AUTO-CALIBRATION block(s) in the site-extension prompt(s) and the per-site `metrics.json`. Layer rationale: reviewer-earned TP/FP examples are site-extension material (CLAUDE.md § "Where a new rule belongs", layer 4); recurring cross-site patterns are only *reported* below for a human to promote.'
            echo
            echo '## Apply log'
            echo
            echo '```'
            cat /tmp/feedback-apply.log
            echo '```'
            echo
            echo '## How to test'
            echo
            echo '```'
            echo 'npm run feedback -- apply   # idempotent: re-running produces no further diff'
            echo 'npm run typecheck && npm test'
            echo '```'
          } > /tmp/pr-body.md

          gh pr create \
            --title "feedback: regenerate calibration from review verdicts" \
            --body-file /tmp/pr-body.md \
            --base main \
            --head "$BRANCH"
